# intruccion para correr el sweep: wandb sweep sweep.yaml

project: banana-disease
entity: Proyecto1_Embebidos

program: train.py
method: bayes
run_cap: 20   # 🔥 mejor que 12

metric:
  name: val_accuracy
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 3
  eta: 2
  s: 2

parameters:

  learning_rate:
    distribution: log_uniform_values
    min: 5e-5
    max: 1e-3

  batch_size:
    values: [8, 16, 32]

  dropout:
    distribution: uniform
    min: 0.3
    max: 0.6

  num_epochs:
    values: [15, 20]

  weight_decay:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-3

  scheduler_patience:
    values: [3, 4, 5]

  early_stopping_patience:
    values: [5, 7]

command:
  - ${env}
  - python
  - ${program}
  - ${args}